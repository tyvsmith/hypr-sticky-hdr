name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 2
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4

      - name: Test and package
        run: make distcheck VERSION="$VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/hypr-sticky-hdr-$VERSION.tar.gz"
          checksum="$archive.sha256"
          gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
